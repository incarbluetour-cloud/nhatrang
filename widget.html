<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>나트랑 시차·날씨·환율</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/sun-typeface/SUIT@2/fonts/static/woff2/SUIT.css">
<style>
*{box-sizing:border-box}
html,body{margin:0;background:transparent}
body{padding:2px 6px 12px;font-family:'SUIT',-apple-system,BlinkMacSystemFont,system-ui,'Malgun Gothic',sans-serif;color:#20242E;word-break:keep-all;-webkit-text-size-adjust:100%}
a{text-decoration:none;color:inherit}
.clocks{display:flex;align-items:stretch;height:96px;background:#fff;border:1px solid #E5E7EB;border-radius:18px;box-shadow:0 6px 16px rgba(27,42,107,.12);overflow:hidden}
.clock{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:0 6px}
.city{font-size:12px;font-weight:700;letter-spacing:.06em;color:#6B7280}
.time{font-size:30px;font-weight:800;color:#27398C;line-height:1.15;white-space:nowrap;font-variant-numeric:tabular-nums}
.time small{font-size:15px;font-weight:700;color:#8C96C4;margin-left:1px}
.date{font-size:12px;color:#6B7280;margin-top:2px;white-space:nowrap}
.mid{flex:0 0 auto;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:0 14px;background:#E4F6F8;font-size:11.5px;font-weight:700;color:#0B7681;line-height:1.45;text-align:center;white-space:nowrap}
.mid b{font-size:16px}
.live{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.card{display:flex;align-items:center;gap:12px;height:72px;background:#fff;border:1px solid #E5E7EB;border-radius:16px;padding:0 16px;box-shadow:0 4px 12px rgba(27,42,107,.10);min-width:0}
.card:hover{border-color:#10A8B8}
.ico{flex:0 0 auto;width:30px;height:30px;font-size:27px;line-height:30px;text-align:center}
.ico img{width:28px;height:28px;border-radius:50%;object-fit:cover;box-shadow:0 1px 3px rgba(0,0,0,.15);vertical-align:middle}
.txt{min-width:0;flex:1}
.lbl{display:block;font-size:11.5px;font-weight:700;color:#6B7280;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.main{display:block;font-size:17px;font-weight:800;color:#27398C;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{display:block;font-size:11.5px;color:#6B7280;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.loading{opacity:.6}
@media(max-width:600px){
  body{padding:2px 6px 10px}
  .clocks{height:88px}
  .time{font-size:24px}.time small{font-size:12px}
  .city,.date{font-size:11px}
  .mid{padding:0 9px;font-size:10.5px}.mid b{font-size:14px}
  .live{gap:8px;margin-top:8px}
  .card{height:66px;gap:8px;padding:0 10px}
  .ico{width:24px;height:24px;font-size:22px;line-height:24px}.ico img{width:22px;height:22px}
  .lbl,.sub{font-size:10.5px}.main{font-size:14.5px}
}
@media(max-width:360px){
  .time{font-size:21px}.time small{font-size:11px}
  .mid{padding:0 6px}
  .card{padding:0 8px;gap:6px}
  .ico{display:none}
  .main{font-size:13.5px}
}
</style>
</head>
<body>
<div class="clocks">
  <div class="clock"><span class="city">서울</span><span class="time" id="tKr">--:--</span><span class="date" id="dKr">대한민국</span></div>
  <div class="mid"><b>-2시간</b>나트랑이<br>2시간 느림</div>
  <div class="clock"><span class="city">나트랑</span><span class="time" id="tVn">--:--</span><span class="date" id="dVn">베트남 현지</span></div>
</div>
<div class="live">
  <a class="card" href="https://www.google.com/search?q=%EB%82%98%ED%8A%B8%EB%9E%91+%EB%82%A0%EC%94%A8" target="_blank" rel="noopener">
    <span class="ico" id="wxIco">🌤️</span>
    <span class="txt"><span class="lbl">나트랑 현재 날씨</span><b class="main loading" id="wx">확인 중…</b><span class="sub" id="wxSub">11월 평균 24~29℃</span></span>
  </a>
  <a class="card" href="https://www.kebhana.com/exchange_rate/excRate.do?subMenu=1" target="_blank" rel="noopener">
    <span class="ico"><img src="https://flagcdn.com/w80/vn.png" alt="베트남 국기"></span>
    <span class="txt"><span class="lbl">베트남 동 환율</span><b class="main loading" id="fx">확인 중…</b><span class="sub" id="fxSub">탭하면 하나은행 고시환율</span></span>
  </a>
</div>
<script>
(function(){
  function el(id){return document.getElementById(id)}
  function ready(n){n.classList.remove('loading')}
  var DAYS=['일','월','화','수','목','금','토'];
  function parts(tz){
    var f=new Intl.DateTimeFormat('en-US',{timeZone:tz,hour12:false,year:'numeric',month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit',second:'2-digit',weekday:'short'});
    var o={};f.formatToParts(new Date()).forEach(function(p){o[p.type]=p.value});
    if(o.hour==='24')o.hour='00';
    var wd={Sun:0,Mon:1,Tue:2,Wed:3,Thu:4,Fri:5,Sat:6}[o.weekday];
    return {t:o.hour+':'+o.minute,s:o.second,d:o.month+'월 '+o.day+'일 ('+DAYS[wd]+')'};
  }
  function tick(){
    var k=parts('Asia/Seoul'),v=parts('Asia/Ho_Chi_Minh');
    el('tKr').innerHTML=k.t+'<small>:'+k.s+'</small>';el('dKr').textContent=k.d;
    el('tVn').innerHTML=v.t+'<small>:'+v.s+'</small>';el('dVn').textContent=v.d;
  }
  tick();setInterval(tick,1000);

  var WX={0:['맑음','☀️'],1:['대체로 맑음','🌤️'],2:['구름 조금','⛅'],3:['흐림','☁️'],45:['안개','🌫️'],48:['안개','🌫️'],51:['이슬비','🌦️'],53:['이슬비','🌦️'],55:['이슬비','🌦️'],56:['이슬비','🌦️'],57:['이슬비','🌦️'],61:['비','🌧️'],63:['비','🌧️'],65:['강한 비','🌧️'],66:['비','🌧️'],67:['강한 비','🌧️'],80:['소나기','🌦️'],81:['소나기','🌧️'],82:['강한 소나기','⛈️'],95:['뇌우','⛈️'],96:['뇌우','⛈️'],99:['뇌우','⛈️']};
  function loadWx(){
    fetch('https://api.open-meteo.com/v1/forecast?latitude=12.2388&longitude=109.1967&current=temperature_2m,apparent_temperature,weather_code&daily=temperature_2m_max,temperature_2m_min&timezone=Asia%2FHo_Chi_Minh&forecast_days=1')
      .then(function(r){if(!r.ok)throw 0;return r.json()})
      .then(function(d){
        var w=WX[d.current.weather_code]||['',''];
        el('wx').textContent=Math.round(d.current.temperature_2m)+'℃ '+w[0];
        if(w[1])el('wxIco').textContent=w[1];
        el('wxSub').textContent='최저 '+Math.round(d.daily.temperature_2m_min[0])+'° · 최고 '+Math.round(d.daily.temperature_2m_max[0])+'° · 체감 '+Math.round(d.current.apparent_temperature)+'°';
        ready(el('wx'));
      })
      .catch(function(){el('wx').textContent='날씨 보기 ›';el('wxSub').textContent='탭하여 실시간 확인';ready(el('wx'))});
  }
  function stamp(){var d=parts('Asia/Seoul');return d.t}
  function setFx(krwPerVnd){
    el('fx').textContent='1만동 ≈ '+Math.round(krwPerVnd*10000).toLocaleString('ko-KR')+'원';
    el('fxSub').textContent='1,000원 ≈ '+(Math.round(1000/krwPerVnd/10)*10).toLocaleString('ko-KR')+'동 · '+stamp()+' 기준';
    ready(el('fx'));
  }
  function fxFail(){el('fx').textContent='환율 보기 ›';el('fxSub').textContent='탭하면 하나은행 고시환율';ready(el('fx'))}
  function loadFx(){
    fetch('https://open.er-api.com/v6/latest/VND')
      .then(function(r){if(!r.ok)throw 0;return r.json()})
      .then(function(d){if(!d.rates||!d.rates.KRW)throw 0;setFx(d.rates.KRW)})
      .catch(function(){
        fetch('https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/vnd.json')
          .then(function(r){if(!r.ok)throw 0;return r.json()})
          .then(function(d){if(!d.vnd||!d.vnd.krw)throw 0;setFx(d.vnd.krw)})
          .catch(fxFail);
      });
  }
  loadWx();loadFx();
  setInterval(loadWx,15*60*1000);setInterval(loadFx,60*60*1000);
})();
</script>
</body>
</html>
